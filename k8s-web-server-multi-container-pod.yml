apiVersion: v1
kind: Pod
metadata:
  name: k8s-web-server-multi-container-pod
spec:
  restartPolicy: Never # kubernetes will not restart the pod if it fails
  volumes:
    - name: shared-data
      emptyDir: {} # This volume is created when the pod is assigned to a node and exists as long as that pod is running on that node. As the name says, it is initially empty. All containers in the pod can read and write the same files in the emptyDir volume, though that volume can be mounted at the same or different paths in each container.
  containers:
    - name: nginx-container
      image: nginx
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
    - name: ubuntu-container
      image: ubuntu
      volumeMounts:
        - name: shared-data
          mountPath: /pod-area
      command: ["/bin/sh"] 
      args: ["-c", "echo '<h1>Welcome to Kubernetes Web Server</h1>' > /pod-area/index.html"] # This command will create an index.html file in the /pod-area directory, which is mounted to the shared-data volume. The nginx-container will serve this file as the default page.